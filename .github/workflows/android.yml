name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk pdf-studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-apk
          path: android/pdf-studio.apk
      - name: Publicar Release (link direto para o APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: PDF Studio Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK do PDF Studio para Android 8.0+.
            Baixe o arquivo pdf-studio.apk abaixo e instale no celular.
          files: android/pdf-studio.apk
