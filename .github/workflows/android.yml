name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Uma mudança nova cancela a compilação anterior ainda em andamento.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes automáticos num emulador Android de verdade.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar app e testes
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Rodar testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Detalhes das falhas
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          for f in files:
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      print('=' * 100)
                      print('FALHOU:', tc.get('classname'), '>', tc.get('name'))
                      print((fl.text or fl.get('message') or '')[:12000])
          print('arquivos:', files)
          EOF
      - name: Guardar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-android
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  # Só publica o APK se os testes passarem.
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PphoneOnly
          cp app/build/outputs/apk/debug/app-debug.apk pdf-studio.apk
      - name: Conferir assinatura (tem que ser sempre a mesma, senão a atualização não instala)
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs pdf-studio.apk | tee certs.txt
          grep -q "ed012cc79f000f85adf4cc962ac1b26353c891d7cec1d34c703cd6198803e93c" certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-apk
          path: android/pdf-studio.apk
      - name: Publicar Release (link direto para o APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: PDF Studio Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            PDF Studio versão 1.1.${{ github.run_number }} para Android 8.0+ (testado automaticamente em emulador).
            Baixe o arquivo pdf-studio.apk abaixo e instale no celular. A versão aparece na tela inicial e no menu ⋮ do app.
          files: android/pdf-studio.apk
