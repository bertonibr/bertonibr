<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo de Matemática</title>
<meta name="theme-color" content="#1f1f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --page: #1f1f1f;
  --card: #2b2b2b;
  --text: #ffffff;
  --muted: #b5b5b5;
  --field: #1e1e1e;
  --blue: #4a86e8;
  --ok: #5fd38a;
  --bad: #ff6b6b;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.card {
  max-width: 420px; margin: 0 auto;
  background: var(--card); border-radius: 22px;
  padding: 28px 24px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
h1 { margin: 0; font-size: clamp(1.2rem, 6.3vw, 1.75rem); font-weight: 500; text-align: center; white-space: nowrap; }
.stats { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 1.15rem; margin-top: -6px; }
.stats b { color: var(--text); }
.hearts { letter-spacing: 1px; }
.problem { font-size: 4.2rem; font-weight: 500; margin: 14px 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
#resposta {
  width: 132px; height: 72px;
  background: var(--field); color: var(--text);
  border: 2px solid var(--text); border-radius: 12px;
  font: inherit; font-size: 2.2rem; text-align: center;
}
#resposta::placeholder { color: #6f6f6f; }
#resposta:focus { outline: none; border-color: var(--blue); }
button {
  width: 100%; border: 0; border-radius: 10px;
  background: var(--blue); color: #fff;
  font: inherit; font-size: 1.4rem; padding: 14px; cursor: pointer;
}
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.feedback { min-height: 1.5em; font-size: 1.2rem; font-weight: 500; text-align: center; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>🧮 Jogo de Matemática</h1>
  <div class="stats">
    <span>Acertos: <b id="acertos">0</b></span>
    <span>Tentativas: <span class="hearts" id="vidas">❤️❤️❤️</span></span>
  </div>

  <div class="problem" id="conta">0 + 0</div>

  <form id="jogo" autocomplete="off">
    <input id="resposta" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="?" aria-label="Resposta" autofocus>
    <button type="submit" id="conferir">Conferir</button>
  </form>
  <button type="button" id="denovo" hidden>Jogar de novo</button>
  <div class="feedback" id="msg" aria-live="polite"></div>
</main>

<script>
(() => {
  const VIDAS = 3;
  const $ = id => document.getElementById(id);
  let a, b, op, acertos, vidas, travado;
  const rnd = n => Math.floor(Math.random() * (n + 1));

  function novaConta() {
    op = Math.random() < .5 ? "+" : "−";
    a = rnd(99);
    b = op === "+" ? rnd(99) : rnd(a); // na subtração o resultado nunca é negativo
    $("conta").textContent = `${a} ${op} ${b}`;
    $("resposta").value = "";
    $("msg").textContent = ""; $("msg").className = "feedback";
    travado = false;
    $("resposta").focus();
  }

  function mostrarVidas() {
    $("vidas").textContent = "❤️".repeat(vidas) + "🤍".repeat(VIDAS - vidas);
  }

  function iniciar() {
    acertos = 0; vidas = VIDAS;
    $("acertos").textContent = 0;
    mostrarVidas();
    $("jogo").hidden = false; $("denovo").hidden = true;
    novaConta();
  }

  $("jogo").addEventListener("submit", e => {
    e.preventDefault();
    const txt = $("resposta").value.trim();
    if (travado || txt === "") { $("resposta").focus(); return; }
    travado = true;
    const certo = op === "+" ? a + b : a - b;
    const msg = $("msg");
    if (parseInt(txt, 10) === certo) {
      acertos++;
      $("acertos").textContent = acertos;
      msg.className = "feedback ok"; msg.textContent = "✅ Certo!";
      setTimeout(novaConta, 800);
    } else {
      vidas--;
      mostrarVidas();
      msg.className = "feedback bad";
      if (vidas === 0) {
        msg.textContent = `❌ Era ${certo}. Fim de jogo! Você acertou ${acertos}.`;
        $("jogo").hidden = true; $("denovo").hidden = false;
        $("resposta").blur();
      } else {
        msg.textContent = `❌ Errado! Era ${certo}.`;
        setTimeout(novaConta, 1500);
      }
    }
  });
  $("resposta").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); });
  $("denovo").addEventListener("click", iniciar);

  iniciar();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
