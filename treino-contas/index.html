<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo de Matemática</title>
<meta name="theme-color" content="#1f1f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --page: #1f1f1f;
  --card: #2b2b2b;
  --text: #ffffff;
  --muted: #b5b5b5;
  --field: #1e1e1e;
  --line: #444444;
  --blue: #4a86e8;
  --purple: #8b5cf6;
  --ok: #5fd38a;
  --bad: #ff6b6b;
  --hint: #ffd166;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
.card, .ajuda-caixa { zoom: .8; } /* interface 20% menor */
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.card {
  max-width: 420px; margin: 0 auto;
  background: var(--card); border-radius: 22px;
  padding: 28px 24px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
h1 { margin: 0; font-size: clamp(1.2rem, 6.3vw, 1.75rem); font-weight: 500; text-align: center; white-space: nowrap; }
.tela { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pergunta { margin: 4px 0 2px; color: var(--muted); font-size: 1.2rem; text-align: center; }
.stats { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 1.15rem; }
.stats > span { white-space: nowrap; }
.stats b { color: var(--text); }
.nivel-info { width: 100%; text-align: center; color: var(--muted); font-size: 1rem; margin-top: -6px; }
.nivel-info b { color: var(--hint); }
.problem { font-size: 4.2rem; font-weight: 500; margin: 14px 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.problem.eq { font-size: clamp(1.7rem, 8.5vw, 2.6rem); margin: 10px 0 2px; }
.dica { margin: -6px 0 0; color: var(--muted); font-size: 1.05rem; }
form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
#resposta {
  width: 160px; height: 72px;
  background: var(--field); color: var(--text);
  border: 2px solid var(--text); border-radius: 12px;
  font: inherit; font-size: 2.2rem; text-align: center;
}
#resposta::placeholder { color: #6f6f6f; }
#resposta:focus { outline: none; border-color: var(--blue); }
button {
  width: 100%; border: 0; border-radius: 10px;
  background: var(--blue); color: #fff;
  font: inherit; font-size: 1.4rem; padding: 14px; cursor: pointer;
}
button.roxo { background: var(--purple); }
button.secundario { background: transparent; border: 2px solid var(--line); color: var(--text); font-size: 1.15rem; padding: 11px; }
button.voltar { background: none; color: var(--muted); font-size: 1rem; padding: 6px; text-decoration: underline; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.separador { width: 100%; height: 1px; background: var(--line); margin: 6px 0; }
.niveis { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.niveis button { font-size: 1rem; padding: 10px 8px; text-align: left; line-height: 1.25; }
.niveis button b { display: block; font-size: 1.15rem; }
.niveis button span { color: #dfe8ff; font-size: .95rem; white-space: nowrap; }
.feedback { min-height: 1.5em; font-size: 1.2rem; font-weight: 500; text-align: center; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }

/* Janela "Como faz?" */
.ajuda {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(0, 0, 0, .7);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.ajuda-caixa {
  width: 100%; max-width: 440px; background: var(--card); border-radius: 18px;
  padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
  border: 2px solid var(--purple);
}
.ajuda h2 { margin: 0; font-size: 1.45rem; font-weight: 500; }
.ajuda p { margin: 0; font-size: 1.1rem; line-height: 1.45; color: #e6e6e6; }
.regra { background: #3a2f5c; border-radius: 10px; padding: 12px 14px; }
.exemplo { font-size: 1.6rem; text-align: center; padding: 6px 0; white-space: nowrap; }
.passos { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: passo; }
.passos li { counter-increment: passo; background: var(--field); border-radius: 10px; padding: 10px 12px 10px 44px; position: relative; font-size: 1.05rem; line-height: 1.4; }
.passos li::before {
  content: counter(passo); position: absolute; left: 10px; top: 10px;
  width: 24px; height: 24px; border-radius: 50%; background: var(--purple);
  font-size: .9rem; display: grid; place-items: center;
}
.passos code { display: block; font-family: inherit; font-size: 1.3rem; color: var(--hint); margin-top: 4px; white-space: nowrap; }
.conferir-x { color: var(--ok); }
sup { font-size: .6em; vertical-align: .9em; line-height: 0; }
.falta { color: var(--hint); }
.regras { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
.regras td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; }
.regras td:first-child { color: var(--hint); font-size: 1.2rem; white-space: nowrap; padding-right: 12px; }
.regras small { color: var(--muted); font-size: .92rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>🧮 Jogo de Matemática</h1>

  <!-- Tela inicial -->
  <section class="tela" id="inicio">
    <p class="pergunta">Que conta você quer treinar?</p>
    <button type="button" data-modo="+">➕ Mais</button>
    <button type="button" data-modo="−">➖ Menos</button>
    <button type="button" data-modo="±">🔀 Misto</button>
    <div class="separador"></div>
    <button type="button" class="roxo" data-trilha="alg">🔤 Álgebra (achar o x)</button>
    <button type="button" class="roxo" data-trilha="pot">🔢 Potências e raízes</button>
  </section>

  <!-- Escolha do nível (álgebra ou potências) -->
  <section class="tela" id="escolha-nivel" hidden>
    <p class="pergunta" id="titulo-niveis">Escolha o nível</p>
    <button type="button" class="secundario" id="aprender">📘 Aprender</button>
    <div class="niveis" id="niveis"></div>
    <button type="button" class="voltar" id="voltar-inicio">Voltar</button>
  </section>

  <!-- Partida -->
  <section class="tela" id="partida" hidden>
    <div class="stats">
      <span>Acertos: <b id="acertos">0</b></span>
      <span>Tentativas: <span id="vidas">❤️❤️❤️</span></span>
    </div>
    <div class="nivel-info" id="nivel-info" hidden></div>

    <div class="problem" id="conta">0 + 0</div>
    <p class="dica" id="dica" hidden>Quanto vale <b>x</b>?</p>

    <form id="jogo" autocomplete="off">
      <input id="resposta" type="text" inputmode="numeric" maxlength="8" placeholder="?" aria-label="Resposta">
      <button type="submit" id="conferir">Conferir</button>
      <button type="button" class="secundario" id="como-faz" hidden>📘 Como faz?</button>
    </form>
    <button type="button" id="denovo" hidden>Jogar de novo</button>
    <div class="feedback" id="msg" aria-live="polite"></div>
    <button type="button" class="voltar" id="sair">Sair</button>
  </section>
</main>

<div class="ajuda" id="ajuda" hidden role="dialog" aria-modal="true" aria-labelledby="ajuda-titulo">
  <div class="ajuda-caixa">
    <h2 id="ajuda-titulo">Como faz</h2>
    <div id="ajuda-corpo"></div>
    <button type="button" class="roxo" id="fechar-ajuda">Entendi!</button>
  </div>
</div>

<script>
(() => {
  const VIDAS = 3;
  const PARA_SUBIR = 5;            // acertos seguidos para subir de nível na álgebra
  const $ = id => document.getElementById(id);
  const rnd = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const naoZero = (min, max) => { let n; do { n = rnd(min, max); } while (n === 0); return n; };

  // ---------- formatação ----------
  const M = "−";
  const num = n => (n < 0 ? M + Math.abs(n) : String(n));
  // termo "ax" no começo da expressão
  const termoX = a => a === 1 ? "x" : a === -1 ? M + "x" : num(a) + "x";
  // soma um número ao fim: "+ 5" ou "− 5"
  const mais = n => n === 0 ? "" : (n < 0 ? ` ${M} ${-n}` : ` + ${n}`);
  // soma um termo com x ao fim: "+ 3x" ou "− x"
  const maisX = a => a === 0 ? "" : (a < 0 ? ` ${M} ${termoX(-a)}` : ` + ${termoX(a)}`);
  const lin = (a, b) => a === 0 ? num(b) : termoX(a) + mais(b);        // ax + b
  const par = n => (n < 0 ? `(${num(n)})` : String(n));                  // número entre parênteses se negativo

  // ---------- 10 níveis de álgebra ----------
  // Cada nível gera { eq, x, passos[] }. Os passos explicam a solução daquele exemplo.
  const NIVEIS = [
    { nome: "x + a = b", gerar() {
      const x = rnd(0, 20), a = rnd(1, 20), b = x + a;
      return { eq: `x + ${a} = ${b}`, x, regra: "O que está somando passa para o outro lado subtraindo.",
        passos: [
          [`Tire ${a} dos dois lados para deixar o x sozinho.`, `x = ${b} ${M} ${a}`],
          [`Faça a conta.`, `x = ${x}`] ] };
    } },
    { nome: "x − a = b", gerar() {
      const a = rnd(1, 20), b = rnd(0, 20), x = a + b;
      return { eq: `x ${M} ${a} = ${b}`, x, regra: "O que está subtraindo passa para o outro lado somando.",
        passos: [
          [`Some ${a} dos dois lados.`, `x = ${b} + ${a}`],
          [`Faça a conta.`, `x = ${x}`] ] };
    } },
    { nome: "a · x = b", gerar() {
      const a = rnd(2, 9), x = rnd(1, 10), b = a * x;
      return { eq: `${a}x = ${b}`, x, regra: `${a}x quer dizer ${a} vezes x. O que está multiplicando passa para o outro lado dividindo.`,
        passos: [
          [`Divida os dois lados por ${a}.`, `x = ${b} ÷ ${a}`],
          [`Faça a conta.`, `x = ${x}`] ] };
    } },
    { nome: "x ÷ a = b", gerar() {
      const a = rnd(2, 9), b = rnd(1, 10), x = a * b;
      return { eq: `x ÷ ${a} = ${b}`, x, regra: "O que está dividindo passa para o outro lado multiplicando.",
        passos: [
          [`Multiplique os dois lados por ${a}.`, `x = ${b} × ${a}`],
          [`Faça a conta.`, `x = ${x}`] ] };
    } },
    { nome: "ax + b = c", gerar() {
      const a = rnd(2, 9), x = rnd(1, 10), b = rnd(1, 20), c = a * x + b;
      return { eq: `${a}x + ${b} = ${c}`, x, regra: "Primeiro tire o número que está somando. Depois divida pelo número que multiplica o x.",
        passos: [
          [`Tire ${b} dos dois lados.`, `${a}x = ${c} ${M} ${b} = ${c - b}`],
          [`Divida os dois lados por ${a}.`, `x = ${c - b} ÷ ${a} = ${x}`] ] };
    } },
    { nome: "ax − b = c", gerar() {
      const a = rnd(2, 9), x = rnd(1, 10), b = rnd(1, a * x), c = a * x - b;
      return { eq: `${a}x ${M} ${b} = ${c}`, x, regra: "Primeiro some o número que está subtraindo. Depois divida pelo número que multiplica o x.",
        passos: [
          [`Some ${b} dos dois lados.`, `${a}x = ${c} + ${b} = ${c + b}`],
          [`Divida os dois lados por ${a}.`, `x = ${c + b} ÷ ${a} = ${x}`] ] };
    } },
    { nome: "com negativos", gerar() {
      const a = naoZero(-9, 9) || 2, x = rnd(-10, 10), b = naoZero(-20, 20), c = a * x + b;
      const k = c - b;
      return { eq: `${lin(a, b)} = ${num(c)}`, x,
        regra: "Igual ao nível 5, mas a resposta pode ser negativa. Sinais: menos com menos dá mais; menos com mais dá menos.",
        passos: [
          [b > 0 ? `Tire ${b} dos dois lados.` : `Some ${-b} dos dois lados.`, `${termoX(a)} = ${num(c)}${mais(-b)} = ${num(k)}`],
          [`Divida os dois lados por ${par(a)}.`, `x = ${num(k)} ÷ ${par(a)} = ${num(x)}`] ] };
    } },
    { nome: "a(x + b) = c", gerar() {
      const a = rnd(2, 6), b = naoZero(-9, 9), x = rnd(-10, 10), c = a * (x + b);
      return { eq: `${a}(x${mais(b)}) = ${num(c)}`, x,
        regra: "Multiplique o número de fora por cada coisa dentro do parênteses (distributiva). Depois resolva como no nível 7.",
        passos: [
          [`Distributiva: ${a} vezes x e ${a} vezes ${par(b)}.`, `${a}x${mais(a * b)} = ${num(c)}`],
          [a * b > 0 ? `Tire ${a * b} dos dois lados.` : `Some ${-a * b} dos dois lados.`, `${a}x = ${num(c - a * b)}`],
          [`Divida os dois lados por ${a}.`, `x = ${num(c - a * b)} ÷ ${a} = ${num(x)}`] ] };
    } },
    { nome: "x dos dois lados", gerar() {
      let a, c; do { a = rnd(2, 9); c = rnd(1, 8); } while (a <= c);
      const x = rnd(-10, 10), b = naoZero(-15, 15), d = (a - c) * x + b;
      const k = d - b;
      return { eq: `${lin(a, b)} = ${termoX(c)}${mais(d)}`, x,
        regra: "Junte os termos com x de um lado e os números do outro. Quem muda de lado troca o sinal.",
        passos: [
          [`Tire ${termoX(c)} dos dois lados.`, `${lin(a - c, b)} = ${num(d)}`],
          [b > 0 ? `Tire ${b} dos dois lados.` : `Some ${-b} dos dois lados.`, `${termoX(a - c)} = ${num(k)}`],
          [a - c === 1 ? `Pronto, o x já está sozinho.` : `Divida os dois lados por ${a - c}.`, a - c === 1 ? `x = ${num(x)}` : `x = ${num(k)} ÷ ${a - c} = ${num(x)}`] ] };
    } },
    { nome: "desafio final", gerar() {
      let a, d; do { a = rnd(2, 5); d = naoZero(-6, 6); } while (a === d);
      const b = naoZero(-6, 6), c = naoZero(-10, 10), x = rnd(-10, 10);
      const e = a * (x + b) + c - d * x;
      const p = a - d, q = a * b + c, k = e - q;
      return { eq: `${a}(x${mais(b)})${mais(c)} = ${termoX(d)}${mais(e)}`, x,
        regra: "Use tudo: distributiva, junte os números, passe o x para um lado e os números para o outro, e divida.",
        passos: [
          [`Distributiva no parênteses.`, `${a}x${mais(a * b)}${mais(c)} = ${termoX(d)}${mais(e)}`],
          [`Junte os números do lado esquerdo.`, `${lin(a, q)} = ${termoX(d)}${mais(e)}`],
          [d > 0 ? `Tire ${termoX(d)} dos dois lados.` : `Some ${termoX(-d)} dos dois lados.`, `${lin(p, q)} = ${num(e)}`],
          [q > 0 ? `Tire ${q} dos dois lados.` : q < 0 ? `Some ${-q} dos dois lados.` : `Não há número para tirar.`, `${termoX(p)} = ${num(k)}`],
          [p === 1 ? `Pronto, o x já está sozinho.` : `Divida os dois lados por ${par(p)}.`, p === 1 ? `x = ${num(x)}` : `x = ${num(k)} ÷ ${par(p)} = ${num(x)}`] ] };
    } },
  ];

  // ---------- 10 níveis de potências e raízes ----------
  const pw = (b, e) => `${b}<sup>${e}</sup>`;                          // b elevado a e
  const falta = b => `${b}<sup class="falta">?</sup>`;
  const vezes = (b, n) => Array(n).fill(b).join(" × ");
  const POTENCIAS = [
    { nome: pw("a", 2) + " ao quadrado", gerar() {
      const a = rnd(0, 12), r = a * a;
      return { eq: pw(a, 2), x: r, regra: `O expoente (o número pequeno em cima) diz quantas vezes a base aparece na multiplicação. Ao quadrado = a base vezes ela mesma.`,
        passos: [[`${pw(a, 2)} é ${a} vezes ${a}.`, `${vezes(a, 2)} = ${r}`]] };
    } },
    { nome: pw("a", 3) + " ao cubo", gerar() {
      const a = rnd(0, 6), r = a * a * a;
      return { eq: pw(a, 3), x: r, regra: `Ao cubo = a base aparece 3 vezes na multiplicação.`,
        passos: [
          [`Escreva a base 3 vezes.`, `${pw(a, 3)} = ${vezes(a, 3)}`],
          [`Multiplique as duas primeiras.`, `${a} × ${a} = ${a * a}`],
          [`Multiplique pelo último ${a}.`, `${a * a} × ${a} = ${r}`] ] };
    } },
    { nome: pw("a", "n") + " expoente 0 a 5", gerar() {
      const b = rnd(2, 5), n = rnd(0, 5), r = b ** n;
      const passos = n === 0
        ? [[`Todo número (menos o 0) elevado a 0 dá 1.`, `${pw(b, 0)} = 1`]]
        : n === 1
          ? [[`Elevado a 1 é o próprio número.`, `${pw(b, 1)} = ${b}`]]
          : [[`Escreva a base ${n} vezes.`, `${pw(b, n)} = ${vezes(b, n)}`],
             [`Vá multiplicando da esquerda para a direita.`, Array.from({ length: n - 1 }, (_, i) => `${b ** (i + 1)} × ${b} = ${b ** (i + 2)}`).join("<br>")]];
      return { eq: pw(b, n), x: r, regra: `Repita a base o número de vezes do expoente. Atenção: expoente 0 dá sempre 1, e expoente 1 dá a própria base.`, passos };
    } },
    { nome: pw(10, "n") + " potência de 10", gerar() {
      const n = rnd(0, 6), r = 10 ** n;
      return { eq: pw(10, n), x: r, regra: `Truque das potências de 10: o expoente é a quantidade de zeros depois do 1.`,
        passos: [[`O expoente é ${n}, então escreva 1 e ${n} zero${n === 1 ? "" : "s"}.`, `${pw(10, n)} = ${r}`]] };
    } },
    { nome: "√ raiz quadrada", gerar() {
      const a = rnd(0, 15), n = a * a;
      return { eq: `√${n}`, x: a, regra: `A raiz quadrada desfaz o quadrado. Pergunte: qual número vezes ele mesmo dá esse valor?`,
        passos: [
          [`Procure o número que vezes ele mesmo dá ${n}.`, `${a} × ${a} = ${n}`],
          [`Então a raiz é ${a}.`, `√${n} = ${a}`] ] };
    } },
    { nome: "∛ raiz cúbica", gerar() {
      const a = rnd(0, 6), n = a ** 3;
      return { eq: `∛${n}`, x: a, regra: `A raiz cúbica desfaz o cubo. Pergunte: qual número multiplicado 3 vezes por ele mesmo dá esse valor?`,
        passos: [
          [`Procure o número que aparece 3 vezes na multiplicação e dá ${n}.`, `${vezes(a, 3)} = ${n}`],
          [`Então a raiz cúbica é ${a}.`, `∛${n} = ${a}`] ] };
    } },
    { nome: "base negativa", gerar() {
      const a = rnd(1, 5), n = rnd(2, a <= 3 ? 4 : 3), r = (-a) ** n;
      return { eq: pw(`(${M}${a})`, n), x: r,
        regra: `Com base negativa entre parênteses: expoente <b>par</b> dá resultado positivo; expoente <b>ímpar</b> dá resultado negativo. Cuidado: ${pw(`${M}${a}`, 2)} sem parênteses é ${M}(${pw(a, 2)}), que é negativo.`,
        passos: [
          [`Faça a conta sem o sinal.`, `${pw(a, n)} = ${a ** n}`],
          [`O expoente ${n} é ${n % 2 ? "ímpar, então o resultado fica negativo" : "par, então o resultado fica positivo"}.`, `${pw(`(${M}${a})`, n)} = ${num(r)}`] ] };
    } },
    { nome: pw("a", "m") + " · " + pw("a", "n"), dica: "Qual é o expoente que falta?", gerar() {
      const b = rnd(2, 9), m = rnd(1, 9), n = rnd(1, 9);
      return { eq: `${pw(b, m)} · ${pw(b, n)} = ${falta(b)}`, x: m + n,
        regra: `Multiplicação de mesma base: mantenha a base e <b>some</b> os expoentes. Exemplo: ${pw(2, 2)} · ${pw(2, 3)} = (2·2)·(2·2·2) = ${pw(2, 5)}.`,
        passos: [
          [`A base é a mesma (${b}). Some os expoentes.`, `${m} + ${n} = ${m + n}`],
          [`Resultado:`, `${pw(b, m)} · ${pw(b, n)} = ${pw(b, m + n)}`] ] };
    } },
    { nome: pw("a", "m") + " ÷ " + pw("a", "n"), dica: "Qual é o expoente que falta?", gerar() {
      const b = rnd(2, 9), m = rnd(3, 12), n = rnd(1, m - 1);
      return { eq: `${pw(b, m)} ÷ ${pw(b, n)} = ${falta(b)}`, x: m - n,
        regra: `Divisão de mesma base: mantenha a base e <b>subtraia</b> os expoentes. Exemplo: ${pw(2, 5)} ÷ ${pw(2, 2)} = ${pw(2, 3)}, porque dois 2 se cancelam.`,
        passos: [
          [`A base é a mesma (${b}). Subtraia os expoentes.`, `${m} ${M} ${n} = ${m - n}`],
          [`Resultado:`, `${pw(b, m)} ÷ ${pw(b, n)} = ${pw(b, m - n)}`] ] };
    } },
    { nome: "(" + pw("a", "m") + ")" + "<sup>n</sup>", dica: "Qual é o expoente que falta?", gerar() {
      const b = rnd(2, 9), m = rnd(2, 6), n = rnd(2, 5);
      return { eq: `(${pw(b, m)})<sup>${n}</sup> = ${falta(b)}`, x: m * n,
        regra: `Potência de potência: mantenha a base e <b>multiplique</b> os expoentes. Exemplo: (${pw(2, 3)})<sup>2</sup> = ${pw(2, 3)} · ${pw(2, 3)} = ${pw(2, 6)}.`,
        passos: [
          [`Multiplique o expoente de dentro pelo de fora.`, `${m} × ${n} = ${m * n}`],
          [`Resultado:`, `(${pw(b, m)})<sup>${n}</sup> = ${pw(b, m * n)}`] ] };
    } },
  ];

  const APRENDER_ALG = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <p>O <b>x</b> é um número escondido. Seu trabalho é descobrir qual é.</p>
      <div class="exemplo">x + 3 = 7</div>
      <p>Pense numa <b>balança</b>: o sinal de <b>=</b> diz que os dois lados pesam igual. Se você fizer a mesma coisa nos dois lados, a balança continua certa.</p>
      <ol class="passos">
        <li>Quero o x sozinho. Ele está com <b>+ 3</b>, então tiro 3 dos dois lados.<code>x + 3 − 3 = 7 − 3</code></li>
        <li>Faço a conta.<code>x = 4</code></li>
        <li>Confiro: troco o x por 4.<code>4 + 3 = 7 ✔</code></li>
      </ol>
      <p class="regra">Regra de ouro: o que está <b>somando</b> passa subtraindo, o que está <b>subtraindo</b> passa somando, o que está <b>multiplicando</b> passa dividindo e o que está <b>dividindo</b> passa multiplicando.</p>
      <p>Comece no nível 1. Acertando ${PARA_SUBIR} seguidas você sobe de nível. Durante o jogo, toque em <b>📘 Como faz?</b> para ver a explicação do nível.</p>
    </div>`;

  const APRENDER_POT = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <p>Potência é uma multiplicação repetida. Em ${pw(2, 3)}, o <b>2</b> é a <b>base</b> e o <b>3</b> é o <b>expoente</b>:</p>
      <div class="exemplo">${pw(2, 3)} = 2 × 2 × 2 = 8</div>
      <p>A <b>raiz</b> faz o caminho de volta: √9 = 3 porque ${pw(3, 2)} = 9.</p>
      <p><b>Todas as regras</b></p>
      <table class="regras"><tbody>
        <tr><td>${pw("a", 0)} = 1</td><td>Expoente zero dá 1 <small>(${pw(7, 0)} = 1)</small></td></tr>
        <tr><td>${pw("a", 1)} = a</td><td>Expoente um dá a própria base <small>(${pw(7, 1)} = 7)</small></td></tr>
        <tr><td>${pw(10, "n")}</td><td>1 seguido de n zeros <small>(${pw(10, 4)} = 10000)</small></td></tr>
        <tr><td>${pw("a", "m")} · ${pw("a", "n")} = ${pw("a", "m+n")}</td><td>Multiplicou com mesma base: <b>soma</b> os expoentes</td></tr>
        <tr><td>${pw("a", "m")} ÷ ${pw("a", "n")} = ${pw("a", "m−n")}</td><td>Dividiu com mesma base: <b>subtrai</b> os expoentes</td></tr>
        <tr><td>(${pw("a", "m")})<sup>n</sup> = ${pw("a", "m·n")}</td><td>Potência de potência: <b>multiplica</b> os expoentes</td></tr>
        <tr><td>(a·b)<sup>n</sup> = ${pw("a", "n")}·${pw("b", "n")}</td><td>O expoente vai para cada fator <small>((2·3)<sup>2</sup> = 4·9 = 36)</small></td></tr>
        <tr><td>(${M}a)<sup>par</sup></td><td>Base negativa com expoente par dá <b>positivo</b> <small>((${M}2)<sup>2</sup> = 4)</small></td></tr>
        <tr><td>(${M}a)<sup>ímpar</sup></td><td>Com expoente ímpar dá <b>negativo</b> <small>((${M}2)<sup>3</sup> = ${M}8)</small></td></tr>
        <tr><td>${pw("a", `${M}n`)} = 1 ÷ ${pw("a", "n")}</td><td>Expoente negativo vira fração <small>(${pw(2, `${M}3`)} = 1/8)</small></td></tr>
        <tr><td>√a</td><td>Qual número ao quadrado dá a? <small>(√49 = 7)</small></td></tr>
        <tr><td>∛a</td><td>Qual número ao cubo dá a? <small>(∛27 = 3)</small></td></tr>
        <tr><td>√(a·b) = √a·√b</td><td>Raiz de produto <small>(√(4·9) = 2·3 = 6)</small></td></tr>
        <tr><td>√a = ${pw("a", "1/2")}</td><td>Raiz é potência com expoente em fração</td></tr>
      </tbody></table>
      <p>Comece no nível 1. Acertando ${PARA_SUBIR} seguidas você sobe de nível. Durante o jogo, toque em <b>📘 Como faz?</b> para ver a explicação do nível.</p>
    </div>`;

  const TRILHAS = {
    alg: { titulo: "Escolha o nível de álgebra", aprender: "📘 Aprender: o que é achar o x?", ajuda: "📘 O que é achar o x?",
           texto: APRENDER_ALG, niveis: NIVEIS, dica: "Quanto vale <b>x</b>?", era: v => `x era ${num(v)}` },
    pot: { titulo: "Escolha o nível de potências e raízes", aprender: "📘 Aprender: regras de potência e raiz", ajuda: "📘 Potências e raízes",
           texto: APRENDER_POT, niveis: POTENCIAS, dica: "Quanto dá?", era: v => `Era ${num(v)}` },
  };

  // ---------- estado ----------
  let modo, nivel, atual, acertos, seguidos, vidas, travado;
  const trilha = () => TRILHAS[modo];

  function mostrar(tela) {
    ["inicio", "escolha-nivel", "partida"].forEach(id => { $(id).hidden = id !== tela; });
  }

  function mostrarVidas() {
    $("vidas").textContent = "❤️".repeat(vidas) + "🤍".repeat(VIDAS - vidas);
  }

  function infoNivel() {
    $("nivel-info").innerHTML = nivel < trilha().niveis.length
      ? `Nível <b>${nivel}</b> de 10 · faltam ${PARA_SUBIR - seguidos} acertos para subir`
      : `Nível <b>10</b> de 10 · o último!`;
  }

  function novaConta() {
    if (trilha()) {
      const nv = trilha().niveis[nivel - 1];
      atual = nv.gerar();
      $("conta").innerHTML = atual.eq;
      $("dica").innerHTML = nv.dica || trilha().dica;
      infoNivel();
    } else {
      const op = modo === "±" ? (Math.random() < .5 ? "+" : "−") : modo;
      const a = rnd(0, 99), b = op === "+" ? rnd(0, 99) : rnd(0, a); // menos: resultado nunca negativo
      atual = { x: op === "+" ? a + b : a - b };
      $("conta").textContent = `${a} ${op} ${b}`;
    }
    $("resposta").value = "";
    $("msg").textContent = ""; $("msg").className = "feedback";
    travado = false;
    $("resposta").focus();
  }

  function iniciar(m, n) {
    modo = m; nivel = n || 1;
    acertos = 0; seguidos = 0; vidas = VIDAS;
    const comNivel = !!trilha();
    $("conta").className = comNivel ? "problem eq" : "problem";
    $("nivel-info").hidden = !comNivel; $("dica").hidden = !comNivel; $("como-faz").hidden = !comNivel;
    $("acertos").textContent = 0;
    mostrarVidas();
    $("jogo").hidden = false; $("denovo").hidden = true;
    mostrar("partida");
    novaConta();
  }

  $("jogo").addEventListener("submit", e => {
    e.preventDefault();
    const txt = $("resposta").value.trim().replace("−", "-");
    if (travado || !/^-?\d+$/.test(txt)) { $("resposta").focus(); return; }
    travado = true;
    const certo = atual.x, msg = $("msg");
    if (parseInt(txt, 10) === certo) {
      acertos++; seguidos++;
      $("acertos").textContent = acertos;
      msg.className = "feedback ok"; msg.textContent = "✅ Certo!";
      if (trilha() && seguidos >= PARA_SUBIR && nivel < trilha().niveis.length) {
        nivel++; seguidos = 0;
        vidas = VIDAS; mostrarVidas();
        msg.textContent = `🎉 Muito bem! Subiu para o nível ${nivel}!`;
        setTimeout(novaConta, 1800);
      } else {
        setTimeout(novaConta, 800);
      }
    } else {
      vidas--; seguidos = 0;
      mostrarVidas();
      if (trilha()) infoNivel();
      msg.className = "feedback bad";
      const era = trilha() ? trilha().era(certo) : `Era ${certo}`;
      if (vidas === 0) {
        msg.textContent = `❌ ${era}. Fim de jogo! Você acertou ${acertos}.`;
        $("jogo").hidden = true; $("denovo").hidden = false;
        $("resposta").blur();
      } else {
        msg.textContent = `❌ Errado! ${era}.`;
        setTimeout(novaConta, 1800);
      }
    }
  });

  // aceita só números e o sinal de menos no começo
  $("resposta").addEventListener("input", e => {
    let v = e.target.value.replace(/[−–]/g, "-").replace(/[^\d-]/g, "");
    v = v.replace(/(?!^)-/g, "");
    if (!trilha()) v = v.replace(/-/g, "");
    e.target.value = v;
  });

  // ---------- telas ----------
  let trilhaEscolhida = "alg";
  function abrirNiveis(t) {
    trilhaEscolhida = t;
    const tr = TRILHAS[t];
    $("titulo-niveis").textContent = tr.titulo;
    $("aprender").textContent = tr.aprender;
    $("niveis").innerHTML = "";
    tr.niveis.forEach((nv, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<b>Nível ${i + 1}</b><span>${nv.nome}</span>`;
      b.addEventListener("click", () => iniciar(t, i + 1));
      $("niveis").appendChild(b);
    });
    mostrar("escolha-nivel");
  }

  document.querySelectorAll("[data-modo]").forEach(btn =>
    btn.addEventListener("click", () => iniciar(btn.dataset.modo)));
  document.querySelectorAll("[data-trilha]").forEach(btn =>
    btn.addEventListener("click", () => abrirNiveis(btn.dataset.trilha)));
  $("voltar-inicio").addEventListener("click", () => mostrar("inicio"));
  const voltar = () => (trilha() ? abrirNiveis(modo) : mostrar("inicio"));
  $("sair").addEventListener("click", voltar);
  $("denovo").addEventListener("click", voltar);

  // ---------- "Como faz?" ----------
  function abrirAjuda(titulo, html) {
    $("ajuda-titulo").textContent = titulo;
    $("ajuda-corpo").innerHTML = html;
    $("ajuda").hidden = false;
    $("ajuda").scrollTop = 0;
    $("fechar-ajuda").focus();
  }
  function fecharAjuda() {
    $("ajuda").hidden = true;
    if (!$("partida").hidden && !$("jogo").hidden) $("resposta").focus();
  }

  // Explica com um exemplo do mesmo nível, diferente da conta que está na tela.
  $("como-faz").addEventListener("click", () => {
    const nv = trilha().niveis[nivel - 1];
    let ex, tentativas = 0;
    do { ex = nv.gerar(); } while (ex.eq === atual.eq && ++tentativas < 50);
    const passos = ex.passos.map(([t, c]) => `<li>${t}<code>${c}</code></li>`).join("");
    const conferir = modo === "alg"
      ? `<p class="conferir-x">✔ Para conferir, troque o x por ${num(ex.x)} na conta: os dois lados dão o mesmo número.</p>`
      : `<p class="conferir-x">✔ Resposta do exemplo: ${num(ex.x)}</p>`;
    abrirAjuda(`📘 Como faz · Nível ${nivel}`, `
      <div style="display:flex;flex-direction:column;gap:14px">
        <p class="regra">${ex.regra}</p>
        <p>Veja um exemplo:</p>
        <div class="exemplo">${ex.eq}</div>
        <ol class="passos">${passos}</ol>
        ${conferir}
        <p>Agora tente a sua: <b>${atual.eq}</b></p>
      </div>`);
  });

  $("aprender").addEventListener("click", () => {
    const tr = TRILHAS[trilhaEscolhida];
    abrirAjuda(tr.ajuda, tr.texto);
  });

  $("fechar-ajuda").addEventListener("click", fecharAjuda);
  $("ajuda").addEventListener("click", e => { if (e.target === $("ajuda")) fecharAjuda(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("ajuda").hidden) fecharAjuda(); });

  mostrar("inicio");

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
