<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Caderno</title>
<meta name="description" content="Caderno digital para escrever à mão com Apple Pencil.">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caderno">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ BIBLIOTECA ============ -->
<section id="library">
  <header class="lib-header">
    <h1>Caderno</h1>
    <div class="lib-actions">
      <button class="icon sync-btn" data-state="off" title="Google Drive">
        <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-7.97A6 6 0 006.1 9.2 4.5 4.5 0 007 18z"/></svg>
      </button>
      <button id="btnImportPdf" class="btn">Importar PDF</button>
      <button id="btnNew" class="btn primary">+ Novo caderno</button>
    </div>
  </header>
  <div id="grid" class="grid"></div>
  <p id="emptyMsg" class="empty" hidden>Nenhum caderno ainda. Toque em <b>+ Novo caderno</b>.</p>
</section>

<!-- ============ EDITOR ============ -->
<section id="editor" hidden>
  <div class="toolbar" id="toolbar">
    <button class="icon" id="btnBack" title="Biblioteca">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="title" id="nbTitle" title="Renomear"></button>
    <span class="sep"></span>

    <button class="icon tool" data-tool="pen" title="Caneta">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg>
    </button>
    <button class="icon tool" data-tool="highlighter" title="Marca-texto">
      <svg viewBox="0 0 24 24"><path d="M9 15l-3 5h6l1-2"/><path d="M8 14l8-10 4 3-8 10z"/></svg>
    </button>
    <button class="icon tool" data-tool="eraser" title="Borracha">
      <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-8 8H8z"/></svg>
    </button>
    <button class="icon tool" data-tool="select" title="Selecionar: contorne a escrita (laço) ou toque numa foto">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg>
    </button>
    <button class="icon" id="btnPhoto" title="Inserir foto">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 8"/></svg>
    </button>
    <span class="sep"></span>

    <div id="colors" class="colors"></div>
    <span class="sep"></span>
    <div id="sizes" class="sizes"></div>
    <span class="sep"></span>

    <button class="icon" id="btnUndo" title="Desfazer">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
    </button>
    <button class="icon" id="btnRedo" title="Refazer">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
    </button>
    <span class="sep"></span>

    <button class="icon" id="btnPenOnly" title="Só a Pencil escreve (dedo rola a página)">
      <svg viewBox="0 0 24 24"><path d="M12 3v10"/><path d="M9 13h6l-3 6z"/><path d="M5 21h14"/></svg>
    </button>
    <button class="icon" id="btnZoomOut" title="Diminuir zoom">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M16 16l4 4"/></svg>
    </button>
    <button class="icon" id="btnZoomIn" title="Aumentar zoom">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M16 16l4 4"/></svg>
    </button>
    <button class="icon" id="btnAddPage" title="Nova página">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></svg>
    </button>
    <button class="icon" id="btnTemplate" title="Papel">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h8"/></svg>
    </button>
    <button class="icon sync-btn" data-state="off" title="Google Drive">
      <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-7.97A6 6 0 006.1 9.2 4.5 4.5 0 007 18z"/></svg>
    </button>
    <button class="icon" id="btnMore" title="Mais">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
  </div>

  <div id="scroller">
    <div id="pages"></div>
  </div>
  <div id="pageInd" class="page-ind">1 / 1</div>
  <div id="selBar" class="sel-bar" hidden>
    <button data-act="rotate">Girar 90°</button>
    <button data-act="reset">Endireitar</button>
    <button data-act="front">Frente</button>
    <button data-act="back">Trás</button>
    <button data-act="dup">Duplicar</button>
    <button data-act="delete" class="danger">Excluir</button>
  </div>
  <div id="strokeBar" class="sel-bar" hidden>
    <span class="sb-colors"></span>
    <button data-act="copy">Copiar</button>
    <button data-act="dup">Duplicar</button>
    <button data-act="delete" class="danger">Excluir</button>
  </div>
</section>

<!-- Diálogo novo caderno -->
<dialog id="dlgNew">
  <form method="dialog" class="dlg">
    <h2>Novo caderno</h2>
    <label>Nome <input id="newName" type="text" placeholder="Sem título" autocomplete="off"></label>
    <div class="field">
      <span>Capa</span>
      <div id="newCovers" class="covers"></div>
    </div>
    <div class="field">
      <span>Papel</span>
      <div id="newTemplates" class="templates"></div>
    </div>
    <div class="dlg-actions">
      <button value="cancel" class="btn">Cancelar</button>
      <button value="ok" class="btn primary" id="newOk">Criar</button>
    </div>
  </form>
</dialog>

<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="filePdf" type="file" accept="application/pdf" hidden>
<input id="fileInsert" type="file" accept="application/pdf,image/*" hidden>
<input id="filePhoto" type="file" accept="image/*" multiple hidden>

<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
